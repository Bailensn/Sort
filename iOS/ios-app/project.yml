name: MyApp

options:
  bundleIdPrefix: com.bailensn
  deploymentTarget:
    iOS: "17.0"
  # 不要手改 MyApp.xcodeproj，一律改这个 yml 后重新生成

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu11
    SWIFT_VERSION: "6.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES

targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # 共享核心：core + capi + ORT 适配层，和 Android 编的是同一批文件
      - path: ../../Native/core
      - path: ../../Native/capi
      - path: ../../Native/adapters/onnx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bailensn.sort
        MARKETING_VERSION: "1.0.0"
        # ⚠️ 每次导出必须递增，否则上传撞 ITMS-90189
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # 纯 SwiftUI App 不需要手写 Info.plist，让 Xcode 生成
        GENERATE_INFOPLIST_FILE: YES
        # 路径相对于 project.yml 所在目录
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/MyApp-Bridging-Header.h
        # 三个契约/适配头目录，顺序不重要
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../../Native/capi $(PROJECT_DIR)/../../Native/core $(PROJECT_DIR)/../../Native/adapters/onnx
        # ORT 还没接：xcframework 放进 Vendor/ 之后再打开这个宏，否则 OnnxBackend
        # 会去找不存在的 onnxruntime_cxx_api.h。
        # GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SORT_WITH_ONNXRUNTIME=1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        # std:: 符号未定义时靠它兜底；onnxruntime 由 xcframework 提供
        OTHER_LDFLAGS: $(inherited) -lc++
    # ORT：把 onnxruntime.xcframework 放到 ios-app/Vendor/ 之后，取消下面三行注释
    # dependencies:
    #   - framework: Vendor/onnxruntime.xcframework
    #     embed: true

  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MyApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bailensn.sort.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MyApp:
    build:
      targets:
        MyApp: all
        MyAppTests: [ test ]
    test:
      targets:
        - MyAppTests
