name: Sort

options:
  bundleIdPrefix: com.bailensn
  deploymentTarget:
    iOS: "17.0"
  # 不要手改 Sort.xcodeproj，一律改这个 yml 后重新生成

settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    GCC_C_LANGUAGE_STANDARD: gnu11
    SWIFT_VERSION: "6.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES

targets:
  Sort:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # 共享核心：core + capi + ORT 适配层，和 Android 编的是同一批文件
      - path: ../../Native/core
      - path: ../../Native/capi
      - path: ../../Native/adapters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bailensn.sort
        MARKETING_VERSION: "1.0.0"
        # ⚠️ 每次导出必须递增，否则上传撞 ITMS-90189
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 纯 SwiftUI App 不需要手写 Info.plist，让 Xcode 生成
        GENERATE_INFOPLIST_FILE: YES
        # 路径相对于 project.yml 所在目录
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/Sort-Bridging-Header.h
        # 三个契约/适配头目录，顺序不重要；Vendor/Headers 是 ORT 的
        HEADER_SEARCH_PATHS: $(inherited) $(PROJECT_DIR)/../../Native/capi $(PROJECT_DIR)/../../Native/core $(PROJECT_DIR)/../../Native/adapters $(PROJECT_DIR)/Vendor/Headers
        # ORT 的 xcframework 不进仓库，CI 用 tools/fetch_ort_ios.sh 下到 Vendor/
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SORT_WITH_ONNXRUNTIME=1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        # std:: 符号未定义时靠它兜底；onnxruntime 是静态 xcframework，
        # 它自己引用的系统框架得由这边显式带上
        OTHER_LDFLAGS: $(inherited) -lc++ -framework CoreFoundation -framework Foundation -framework Network -framework Security -framework SystemConfiguration -framework UIKit -weak_framework CoreML
    # 静态框架，不要 embed（embed 会把它塞进 app 的 Frameworks/ 反而多一份）
    dependencies:
      - framework: Vendor/onnxruntime.xcframework
        embed: false
        link: true

  SortTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Sort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bailensn.sort.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sort:
    build:
      targets:
        Sort: all
        SortTests: [ test ]
    test:
      targets:
        - SortTests
