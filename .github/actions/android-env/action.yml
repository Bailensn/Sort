name: Android environment
description: JDK 21、Android SDK、Gradle 缓存与 OCR 模型缓存

inputs:
  sdk-packages:
    description: 需要安装的 SDK 包，空格分隔
    required: false
    default: "platforms;android-37.0 build-tools;36.0.0"

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Install SDK components
      shell: bash
      run: |
        # composite action 的 shell: bash 带 -eo pipefail：sdkmanager 读够后退出，
        # yes 会收到 SIGPIPE（141），整条管道就判失败。所以这里必须 || true 兜住。
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install ${{ inputs.sdk-packages }}

    # OCR 模型约 31 MB，由 :app:downloadOcrModels 在构建期下载。
    - name: Cache OCR models
      uses: actions/cache@v6
      with:
        path: app/build/generated/ocrModels
        key: ocr-models-ppocrv6-small-v3

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x ./gradlew
