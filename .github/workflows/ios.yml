name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  # main 上的推送跑完，PR 只跑最新一次
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    # macos-14 已停止维护，跟随最新稳定镜像
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS/ios-app
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: iOS/ios-app/Resources/models
          key: ios-onnx-models-v1
      - name: Download models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p Resources/models
          hf=https://huggingface.co/PaddlePaddle
          curl -fsSL -o Resources/models/det.onnx "$hf/PP-OCRv6_medium_det_onnx/resolve/main/inference.onnx"
          curl -fsSL -o Resources/models/rec.onnx "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx"
          curl -fsSL -o Resources/models/rec.yml  "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.yml"
          python3 "$GITHUB_WORKSPACE/tools/compress_models.py" \
            Resources/models/det.onnx Resources/models/rec.onnx Resources/models/rec.yml
          ls -lh Resources/models | tee -a build.log
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: |
            iOS/ios-app/build-sim
            iOS/ios-app/build-device
          key: ios-derived-${{ hashFiles('iOS/ios-app/project.yml') }}
          restore-keys: ios-derived-
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          set -o pipefail
          xcodebuild -project MyApp.xcodeproj -scheme MyApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES build 2>&1 | tee build.log
      - name: Package simulator app
        run: |
          cd build-sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/MyApp-simulator.zip" MyApp.app
      - name: Build device
        run: |
          set -o pipefail
          xcodebuild -project MyApp.xcodeproj -scheme MyApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee -a build.log
      - name: Package unsigned ipa
        run: |
          APP=build-device/Build/Products/Release-iphoneos/MyApp.app
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/MyApp-unsigned.ipa" Payload
      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: MyApp-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: MyApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log ios-build.log ci-log-ios-build

  test:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS/ios-app
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: iOS/ios-app/Resources/models
          key: ios-onnx-models-v1
      - name: Download models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p Resources/models
          hf=https://huggingface.co/PaddlePaddle
          curl -fsSL -o Resources/models/det.onnx "$hf/PP-OCRv6_medium_det_onnx/resolve/main/inference.onnx"
          curl -fsSL -o Resources/models/rec.onnx "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx"
          curl -fsSL -o Resources/models/rec.yml  "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.yml"
          python3 "$GITHUB_WORKSPACE/tools/compress_models.py" \
            Resources/models/det.onnx Resources/models/rec.onnx Resources/models/rec.yml
          ls -lh Resources/models | tee -a build.log
      - name: Cache DerivedData
        uses: actions/cache@v6
        with:
          path: iOS/ios-app/build-test
          key: ios-test-derived-${{ hashFiles('iOS/ios-app/project.yml') }}
          restore-keys: ios-test-derived-
      - name: Generate project
        run: xcodegen generate
      - name: Run tests
        run: |
          set -o pipefail
          # 具体机型名字随 Xcode 变，直接取第一个可用的模拟器。
          DEVICE=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.isAvailable)][0].udid')
          xcodebuild test -project MyApp.xcodeproj -scheme MyApp \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES 2>&1 | tee build.log
      - name: Publish test log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log ios-test.log ci-log-ios-test
