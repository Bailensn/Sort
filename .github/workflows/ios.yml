name: iOS

on:
  # 没有苹果设备，只在手动验证时跑；不要跟着每次推送占 macOS 机时。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (device binary, unsigned)
    # macos-14 已停止维护，跟随最新稳定镜像
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iOS/ios-app
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package simulator app
        run: |
          cd build-sim/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/MyApp-simulator.zip" MyApp.app
      - name: Build device
        run: |
          xcodebuild -project MyApp.xcodeproj -scheme MyApp \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package unsigned ipa
        run: |
          APP=build-device/Build/Products/Release-iphoneos/MyApp.app
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/MyApp-unsigned.ipa" Payload
      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: MyApp-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned-ipa
          path: MyApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
