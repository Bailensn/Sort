name: Convert Models

on:
  # 只在转换脚本本身改动时跑（要下上百 MB 的工具和模型），平时推送不带上。
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/models.yml"
  workflow_dispatch:

permissions:
  # 失败时把日志推到 ci-log-models
  contents: write

jobs:
  convert:
    name: Convert to .ms
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MSLITE_VERSION: "2.10.0"
      HF: https://huggingface.co/PaddlePaddle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Download ONNX models
        run: |
          set -o pipefail
          mkdir -p models
          curl -fsSL -o models/det.onnx "$HF/PP-OCRv6_medium_det_onnx/resolve/main/inference.onnx"
          curl -fsSL -o models/rec.onnx "$HF/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx"
          ls -lh models | tee -a build.log
      - name: Download MindSpore Lite toolkit
        run: |
          set -o pipefail
          # 2.7 起路径从 MindSpore/ 换成了 MindSporeLite/，旧地址会 403
          base="https://ms-release.obs.cn-north-4.myhuaweicloud.com/${MSLITE_VERSION}/MindSporeLite/lite/release/linux/x86_64"
          url="${base}/mindspore-lite-${MSLITE_VERSION}-linux-x64.tar.gz"
          echo "下载 $url" | tee -a build.log
          curl -fsSL -o mslite.tar.gz "$url" 2>&1 | tee -a build.log
          tar xzf mslite.tar.gz 2>&1 | tee -a build.log
          ls -d mindspore-lite-* | tee -a build.log
          find mindspore-lite-* -name 'converter_lite' | tee -a build.log
      - name: Convert ONNX to .ms
        run: |
          set -o pipefail
          set +e
          CONVERTER=$(find mindspore-lite-* -name converter_lite | head -1)
          echo "converter: $CONVERTER" | tee -a build.log
          "$CONVERTER" --help 2>&1 | head -30 | tee -a build.log
          # det 的输入是动态的（32 的倍数），先按 640x640 试一版
          "$CONVERTER" --fmk=ONNX --modelFile=models/det.onnx \
            --outputFile=models/det --inputShape="x:1,3,640,640" 2>&1 | tee -a build.log
          echo "det rc=$?" | tee -a build.log
          # rec 高固定 48、宽按比例，这里给一个典型宽度
          "$CONVERTER" --fmk=ONNX --modelFile=models/rec.onnx \
            --outputFile=models/rec --inputShape="x:1,3,48,320" 2>&1 | tee -a build.log
          echo "rec rc=$?" | tee -a build.log
          set -e
          ls -lh models | tee -a build.log
      - name: Upload ms
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-ms-models
          path: models/**/*.ms
          if-no-files-found: warn
          retention-days: 14
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-log.sh build.log models.log ci-log-models
