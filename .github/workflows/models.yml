name: Convert Models

on:
  # 只在转换脚本本身改动时跑（要下上百 MB 的工具和模型），平时推送不带上。
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/models.yml"
  workflow_dispatch:

permissions:
  # 失败时把日志推到 ci-log-models
  contents: write

jobs:
  convert:
    name: Convert to .ms
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MSLITE_VERSION: "2.10.0"
      HF: https://huggingface.co/PaddlePaddle
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Convert
        run: |
          set -o pipefail
          bash tools/convert_models.sh models 2>&1 | tee build.log
      - name: Upload ms
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-ms-models
          path: |
            models/*.ms
            models/*.yml
          if-no-files-found: warn
          retention-days: 14
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-log.sh build.log models.log ci-log-models
