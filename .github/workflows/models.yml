name: Release models

# 给国内主源兜底：把 5 个模型挂到 GitHub Release 上，App 里当备用源。
# 手动跑一次即可，产物地址是 releases/download/<tag>/<文件名>。
# 注意 App 里钉的是 models-v1；换标签要同时改 ModelInstaller.BACKUP_BASE。
on:
  workflow_dispatch:
  push:
    tags:
      - "models-*"

permissions:
  contents: write

env:
  # 独立的 tag 与标题：和 App 的版本发布完全分开，不受触发方式影响，
  # 推任何 models-* 标签都只会更新这一个 release。
  RELEASE_TAG: models-v1
  RELEASE_NAME: OCR Models
  # 必须和 tools/fetch_mnn.sh 的运行时版本一致，否则转出来的 .mnn 加载不了
  MNN_VERSION: "3.6.2"

jobs:
  publish:
    name: Publish model assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Download official models
        run: |
          set -euo pipefail
          mkdir -p out
          hf=https://huggingface.co/PaddlePaddle
          curl -fsSL -o out/det.onnx "$hf/PP-OCRv6_medium_det_onnx/resolve/main/inference.onnx"
          curl -fsSL -o out/rec.onnx "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx"
          curl -fsSL -o out/rec.yml "$hf/PP-OCRv6_medium_rec_onnx/resolve/main/inference.yml"
          curl -fsSL -o out/referee.onnx "$hf/PP-OCRv5_server_rec_onnx/resolve/main/inference.onnx"
          curl -fsSL -o out/referee.yml "$hf/PP-OCRv5_server_rec_onnx/resolve/main/inference.yml"
          # v5 / v4：官方只发 Paddle 权重，onnx 用社区镜像（哈希钉死）；
          # 字符表仍取官方的 inference.yml
          v5=https://huggingface.co/webnn/PP-OCRv5-ONNX/resolve/main
          curl -fsSL -o out/ch_PP-OCRv5_det.onnx "$v5/ch_PP-OCRv5_det.onnx"
          curl -fsSL -o out/ch_PP-OCRv5_rec.onnx "$v5/ch_PP-OCRv5_rec.onnx"
          curl -fsSL -o out/v5-rec.yml "$hf/PP-OCRv5_mobile_rec/resolve/main/inference.yml"
          v4=https://huggingface.co/webnn/PP-OCRv4-ONNX/resolve/main
          curl -fsSL -o out/ch_PP-OCRv4_det.onnx "$v4/ch_PP-OCRv4_det.onnx"
          curl -fsSL -o out/ch_PP-OCRv4_rec.onnx "$v4/ch_PP-OCRv4_rec.onnx"
          curl -fsSL -o out/v4-rec.yml "$hf/PP-OCRv4_mobile_rec/resolve/main/inference.yml"
          ls -l out
      - name: Verify against models.lock
        run: |
          set -euo pipefail
          grep -v '^#' tools/models.lock \
            | awk '{print $2"  out/"$3}' \
            | sha256sum -c -
      # 鸿蒙要的是 .mnn，和 onnx 不是同一份字节，得现场转一份挂上去
      - name: Cache MNNConverter
        id: converter
        uses: actions/cache@v6
        with:
          path: mnn-build/MNNConvert
          key: mnnconvert-${{ env.MNN_VERSION }}-v1
      - name: Convert to .mnn
        run: |
          set -euo pipefail
          conv=$(command -v mnnconvert || true)
          if [ -z "${conv:-}" ]; then
            pip3 install --quiet --break-system-packages "MNN==${MNN_VERSION}" >/dev/null 2>&1 || true
            conv=$(command -v mnnconvert || true)
          fi
          if [ -z "${conv:-}" ]; then
            if [ ! -x mnn-build/MNNConvert ]; then
              git clone --depth 1 --branch "${MNN_VERSION}" https://github.com/alibaba/MNN.git mnn-src
              cmake -S mnn-src -B mnn-build -DMNN_BUILD_CONVERTER=ON \
                -DMNN_BUILD_SHARED_LIBS=OFF -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF \
                -DMNN_AVX512=OFF > /dev/null
              cmake --build mnn-build --target MNNConvert -j"$(nproc)" > /dev/null
            fi
            conv=./mnn-build/MNNConvert
          fi
          echo "[mnn] 用 $conv"
          "$conv" -f ONNX --modelFile out/det.onnx --MNNModel out/det.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/rec.onnx --MNNModel out/rec.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/referee.onnx --MNNModel out/referee.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/ch_PP-OCRv5_det.onnx --MNNModel out/v5-det.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/ch_PP-OCRv5_rec.onnx --MNNModel out/v5-rec.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/ch_PP-OCRv4_det.onnx --MNNModel out/v4-det.mnn --bizCode sort 2>&1 | tail -3
          "$conv" -f ONNX --modelFile out/ch_PP-OCRv4_rec.onnx --MNNModel out/v4-rec.mnn --bizCode sort 2>&1 | tail -3
          ls -l out/*.mnn
          # 转换产物的哈希要回填进 tools/models.mnn.lock 和 App，这里打出来方便抄
          echo "--- 转换产物哈希 ---"
          sha256sum out/*.mnn out/v4-rec.yml out/v5-rec.yml | sed 's|  out/|  |'
          # 中间物到此为止：后面只传 .mnn 和字符表
          rm -f out/*.onnx
          ls -l out
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 传的只有 .mnn 和字符表（onnx 在上一步已经删掉）
          # 整条重建：--clobber 只覆盖同名文件，上次传过、这次不再产出的会一直挂着
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --prerelease \
            --title "$RELEASE_NAME" \
            --notes "PaddleOCR 官方模型（Apache-2.0）。App 从这里取备用下载源，删了会导致主源失效时装不上。"
          gh release upload "$RELEASE_TAG" \
            out/det.mnn out/rec.mnn out/rec.yml \
            out/v5-det.mnn out/v5-rec.mnn out/v5-rec.yml \
            out/v4-det.mnn out/v4-rec.mnn out/v4-rec.yml \
            out/referee.mnn out/referee.yml
          echo "已发布：https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
      # 同一批文件再传一份 artifact：release 给 App 匿名下载，artifact 给登录的人手取
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ocr-models
          path: |
            out/det.mnn
            out/rec.mnn
            out/rec.yml
            out/v5-det.mnn
            out/v5-rec.mnn
            out/v5-rec.yml
            out/v4-det.mnn
            out/v4-rec.mnn
            out/v4-rec.yml
            out/referee.mnn
            out/referee.yml
          retention-days: 14
          if-no-files-found: warn
