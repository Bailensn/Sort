name: HarmonyOS CI

on:
  # 鸿蒙还是骨架，别在每次推送时白跑；等有界面了再打开 push 触发。
  workflow_dispatch:

permissions:
  # 失败时要把日志推到 ci-logs 分支
  contents: write

concurrency:
  group: harmony-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HAP
    # Ubuntu 也能跑：镜像里带着 DevEco 命令行工具（hvigorw + HarmonyOS SDK）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 工程已降到 modelVersion 6.0.2 / SDK 6.0.0(20)，跟镜像里的 hvigor 对齐。
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    defaults:
      run:
        working-directory: Harmony
        # 容器里默认是 sh(dash)，没有 pipefail，统一切到 bash。
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check project present
        run: |
          if [ ! -f build-profile.json5 ]; then
            echo "::error::Harmony/ 不在工作区，检查 checkout 是否完整"
            exit 1
          fi
      - name: Install dependencies
        run: ohpm install --all
      - name: Build
        run: |
          set -o pipefail
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon 2>&1 | tee build.log
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log harmony-build.log ci-log-harmony-build
      - name: Upload HAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-hap
          path: |
            Harmony/main/build/default/outputs/**/*.hap
            Harmony/main/build/default/outputs/**/*.app
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Code Linter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    defaults:
      run:
        working-directory: Harmony
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ohpm install --all
      - name: Code linter
        run: |
          set -o pipefail
          hvigorw codeLinter --no-daemon 2>&1 | tee build.log
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log harmony-lint.log ci-log-harmony-lint
