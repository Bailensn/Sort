name: HarmonyOS

on:
  # 鸿蒙还是骨架，别在每次推送时白跑；等有界面了再打开 push 触发。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HAP
    # Ubuntu 也能跑：镜像里带着 DevEco 命令行工具（hvigorw + HarmonyOS SDK）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
    defaults:
      run:
        working-directory: Harmony
        # 容器里默认是 sh(dash)，没有 pipefail，统一切到 bash。
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check project present
        run: |
          if [ ! -f build-profile.json5 ]; then
            echo "::error::Harmony/ 不在工作区，检查 checkout 是否完整"
            exit 1
          fi
      - name: Install dependencies
        run: ohpm install --all
      - name: Build
        run: |
          set -o pipefail
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon 2>&1 | tee build.log
      - name: Upload HAP
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-hap
          path: Harmony/main/build/default/outputs/**/*.hap
          if-no-files-found: warn
          retention-days: 14
