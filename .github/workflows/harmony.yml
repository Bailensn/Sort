name: Harmony CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  # 失败时要把日志推到 ci-logs 分支
  contents: write

concurrency:
  group: harmony-${{ github.ref }}
  # main 上的推送跑完，PR 只跑最新一次
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build HAP
    # Ubuntu 也能跑：镜像里带着 DevEco 命令行工具（hvigorw + HarmonyOS SDK）。
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 工程已降到 modelVersion 6.0.2 / SDK 6.0.0(20)，跟镜像里的 hvigor 对齐。
    container: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:latest
    defaults:
      run:
        working-directory: Harmony
        # 容器里默认是 sh(dash)，没有 pipefail，统一切到 bash。
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Check project present
        run: |
          if [ ! -f build-profile.json5 ]; then
            echo "::error::Harmony/ 不在工作区，检查 checkout 是否完整"
            exit 1
          fi
      - name: Cache converted models
        id: model-cache
        uses: actions/cache@v6
        with:
          path: Harmony/main/src/main/resources/rawfile/models
          key: ocr-ms-models-v2
      - name: Cache converted .ms
        id: mslite-raw
        uses: actions/cache@v6
        with:
          path: /tmp/mslite
          key: mslite-raw-2.10.0-v1
      - name: Prepare models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          # 整步都进 build.log：失败时只看得到日志分支，看不到控制台
          exec > >(tee -a build.log) 2>&1
          if [ -f /tmp/mslite/det.ms ]; then
            echo "[models] 复用缓存的 .ms"
          else
            bash "$GITHUB_WORKSPACE/tools/convert_models.sh" /tmp/mslite
          fi

          dest="$GITHUB_WORKSPACE/Harmony/main/src/main/resources/rawfile/models"
          mkdir -p "$dest"
          cp /tmp/mslite/det.ms /tmp/mslite/rec.ms /tmp/mslite/rec.yml "$dest/"

          # rawfile 里只放一个 zip，由 ArkTS 侧解到沙箱，省安装包体积。
          # 容器里没有 zip/python3/cmake，只有 jar（java 17 自带）
          echo "[zip] zip=$(command -v zip || echo no) py=$(command -v python3 || echo no) cmake=$(command -v cmake || echo no) jar=$(command -v jar || echo no)"
          (
            cd "$dest"
            if command -v zip > /dev/null; then
              zip -9 -q models.zip det.ms rec.ms rec.yml
            elif command -v python3 > /dev/null; then
              python3 -m zipfile -c models.zip det.ms rec.ms rec.yml
            elif command -v cmake > /dev/null; then
              cmake -E tar cf models.zip --format=zip det.ms rec.ms rec.yml
            elif command -v jar > /dev/null; then
              jar cfM models.zip det.ms rec.ms rec.yml
            else
              echo "::error::容器里没有 zip/python3/cmake/jar，打不了 models.zip"
              exit 1
            fi
            rm -f det.ms rec.ms rec.yml
          )
          ls -lh "$dest"
      - name: Fetch MNN
        run: |
          # 官方预编译包：只有 lib，没有头（头文件已 vendored 在 Native/adapters/mnn/include）
          dest="$GITHUB_WORKSPACE/Harmony/main/src/main/cpp/third_party/mnn"
          bash "$GITHUB_WORKSPACE/tools/fetch_mnn.sh" "$dest"
          lib=$(find "$dest" -name 'libMNN.so' -path '*arm64*' | head -1) || true
          [ -n "${lib:-}" ] || lib=$(find "$dest" -name 'libMNN.so' | head -1) || true
          if [ -n "${lib:-}" ]; then
            echo "MNN_LIB=$lib" >> "$GITHUB_ENV"
            echo "[mnn] $lib" | tee -a build.log
          else
            echo "::warning::MNN 包里没找到 libMNN.so"
          fi
      - name: Cache ohpm
        uses: actions/cache@v6
        with:
          path: Harmony/oh_modules
          key: ohpm-${{ hashFiles('Harmony/oh-package.json5', 'Harmony/oh-package-lock.json5') }}
          restore-keys: ohpm-
      - name: Install dependencies
        run: ohpm install --all
      - name: Build
        run: |
          set -o pipefail
          hvigorw clean --no-daemon
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon 2>&1 | tee -a build.log
      - name: Build APP
        run: |
          set -o pipefail
          # HAP 只是单模块产物，整包（.app）走 project 模式；没有签名配置时出 unsigned。
          hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-daemon 2>&1 | tee -a build.log
      - name: Verify package contents
        run: |
          set -o pipefail
          echo "--- 产物 ---" | tee -a build.log
          find "$GITHUB_WORKSPACE/Harmony" -path '*outputs*' \( -name '*.hap' -o -name '*.app' \) -printf '%s %p\n' 2>/dev/null | tee -a build.log

          hap=$(find "$GITHUB_WORKSPACE/Harmony" -path '*outputs*' -name '*.hap' | head -1)
          [ -n "$hap" ] || { echo "::error::没有产出 .hap"; exit 1; }

          # 模型是 .ms 二进制，HAP 必须有十几 MB 以上；不到就是 rawfile 没打进去（曾经的 Harmony/Harmony 路径 bug）。
          size=$(stat -c%s "$hap")
          echo "HAP 大小: $((size / 1024 / 1024)) MB" | tee -a build.log
          [ "$size" -gt 30000000 ] || { echo "::error::HAP 只有 $((size/1024)) KB，模型没打进去"; exit 1; }

          list=
          if command -v unzip > /dev/null; then
            list=$(unzip -l "$hap")
          elif command -v python3 > /dev/null; then
            list=$(python3 -c 'import sys,zipfile; [print(i.filename) for i in zipfile.ZipFile(sys.argv[1]).infolist()]' "$hap")
          fi

          if [ -z "$list" ]; then
            echo "::warning::容器里没有 unzip/python3，跳过包内清单校验"
            exit 0
          fi

          printf '%s\n' "$list" > entries.txt
          grep -E 'libs/.*/libmain\.so' entries.txt || { echo "::error::HAP 里没有 libmain.so"; exit 1; }
          grep -E 'rawfile/models/models\.zip' entries.txt || { echo "::error::HAP 里没有 models.zip"; exit 1; }
          echo "包内校验通过" | tee -a build.log
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log harmony-build.log ci-log-harmony-build
      - name: Upload HAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harmony-hap
          path: |
            Harmony/main/build/default/outputs/**/*.hap
            Harmony/build/outputs/**/*.app
          if-no-files-found: warn
          retention-days: 14
