name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # 缓存按周清理一次，避免 Gradle Home 越滚越大。
          cache-cleanup: on-success
      - name: Install SDK components
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null || true
          installed=""
          for attempt in 1 2; do
            if sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;30.0.16248370" > sdk-install.log 2>&1; then
              installed=1
              break
            fi
            echo "第 $attempt 次安装失败，5 秒后重试"
            tail -5 sdk-install.log || true
            sleep 5
          done
          if [ -z "$installed" ]; then
            tail -20 sdk-install.log || true
            echo "::error::SDK 组件安装失败：$(tail -3 sdk-install.log | tr '\n' ' ')"
            exit 1
          fi
      # 构建期要下载约 139 MB 的内置模型，缓存后不用每次拉。
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: app/build/generated/ocrModels
          key: ocr-models-medium-v1
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleDebug 2>&1 | tee build.log \
            || { bash .github/scripts/print-errors.sh build.log; exit 1; }
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose failure
        if: failure()
        run: |
          echo "::error::环境诊断 job=${{ github.job }} sdk=${ANDROID_SDK_ROOT:-unset} java=${JAVA_HOME:-unset} sdkmanager=$(command -v sdkmanager || echo none)"

