name: CI

on:
  # 只手动跑：Kotlin 那套还没在 CI 上验证过，先别跟着每次推送烧时间。
  workflow_dispatch:

permissions:
  # 失败时要把日志推到 ci-log-* 分支
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # main 上的推送要跑完：连着推几次时，取消旧的那次等于哪个都跑不完。
  # PR 仍然只在最新提交上跑。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 纯 C++ 核心：不依赖任何平台 SDK，跑得最快，挂在这里先挡一道。
  native-core:
    name: Native core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S Native -B Native/build -DSORT_BUILD_TESTS=ON -DSORT_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build Native/build --parallel 2
      - name: Smoke test
        run: ctest --test-dir Native/build --output-on-failure
      - name: C ABI headers stay pure C
        run: |
          printf '#include "engine_errors.h"\n#include "engine_ocr_capi.h"\nint main(void){return 0;}\n' > /tmp/abi_check.c
          gcc -std=c11 -Wall -Wextra -INative/capi -c /tmp/abi_check.c -o /tmp/abi_check.o

  assemble-release:
    name: Assemble release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Check for real names
        working-directory: ${{ github.workspace }}
        env:
          REAL_NAME_HASHES: ${{ secrets.REAL_NAME_HASHES }}
        run: bash .github/scripts/check-real-names.sh
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble release
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleRelease 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint debug
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:lintDebug 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
      - name: Check lint findings
        id: lint-findings
        if: always()
        run: |
          xml=app/build/reports/lint-results-debug.xml
          if [ ! -f "$xml" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          warnings=$(grep -c 'severity="Warning"' "$xml" || true)
          errors=$(grep -c 'severity="Error"' "$xml" || true)
          if [ "$warnings" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload lint report
        if: always() && steps.lint-findings.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            Android/app/build/reports/lint-results-*.html
            Android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:testDebugUnitTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"

  android-test:
    name: Instrumentation APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble instrumentation APK
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleDebugAndroidTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
