name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-env
        with:
          sdk-packages: "platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1 ndk;30.0.16248370"
      - name: Assemble debug and release
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all \
            :app:assembleDebug :app:assembleRelease 2>&1 | tee build.log
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-assemble
          path: build.log
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-env
      - name: Lint debug
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all :app:lintDebug 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-lint
          path: build.log
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-env
      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all :app:testDebugUnitTest 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-unit-test
          path: build.log
          if-no-files-found: warn
          retention-days: 7

  android-test:
    name: Instrumentation APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-env
        with:
          sdk-packages: "platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1 ndk;30.0.16248370"
      - name: Assemble instrumentation APK
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all :app:assembleDebugAndroidTest 2>&1 | tee build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-android-test
          path: build.log
          if-no-files-found: warn
          retention-days: 7
