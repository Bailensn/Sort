name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  # 失败时要把日志推到 ci-log-* 分支
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  # main 上的推送要跑完：连着推几次时，取消旧的那次等于哪个都跑不完。
  # PR 仍然只在最新提交上跑。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 纯 C++ 核心：不依赖任何平台 SDK，跑得最快，挂在这里先挡一道。
  native-core:
    name: Native core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Cache native build
        uses: actions/cache@v6
        with:
          path: Native/build
          key: native-build-${{ hashFiles('Native/**') }}
          restore-keys: native-build-
      - name: Configure
        run: cmake -S Native -B Native/build -DSORT_BUILD_TESTS=ON -DSORT_BUILD_TOOLS=ON
      - name: Build
        run: |
          set -o pipefail
          cmake --build Native/build --parallel 2 2>&1 | tee build.log
      - name: Smoke test
        run: ctest --test-dir Native/build --output-on-failure
      - name: Cache MindSpore Lite models
        id: ms-cache
        uses: actions/cache@v6
        with:
          path: /tmp/ms
          key: mslite-models-2.10.0-v1
      - name: Prepare MindSpore Lite models
        if: steps.ms-cache.outputs.cache-hit != 'true'
        run: MSLITE_KEEP_RUNTIME=1 bash tools/convert_models.sh /tmp/ms
      # 这一段验的是**鸿蒙**的 MindSpore 适配层，跟 Android 包无关：
      # 安卓用 ORT，只有鸿蒙用 .ms。放在这里纯粹因为这个 job 有 cmake + gcc。
      - name: MindSpore Lite host OCR (Harmony backend)
        run: |
          set -o pipefail
          root=$(ls -d /tmp/ms/mindspore-lite-* | head -1)
          echo "[ms] root=$root" | tee -a build.log
          cmake -S Native -B Native/build-ms -DSORT_MSLITE_HOST_TEST=ON -DMSLITE_ROOT="$root" \
            -DSORT_BUILD_TESTS=OFF -DSORT_BUILD_TOOLS=OFF 2>&1 | tee -a build.log
          cmake --build Native/build-ms --parallel 2 --target ocr_mslite_dump 2>&1 | tee -a build.log
          LD_LIBRARY_PATH="$root/runtime/lib:$root/tools/converter/lib" ./Native/build-ms/ocr_mslite_dump \
            --det /tmp/ms/det.ms --rec /tmp/ms/rec.ms --charset /tmp/ms/rec.yml \
            --image Native/tests/data/table.ppm 2>&1 | tee -a build.log > mslite.json
          cat mslite.json | tee -a build.log
          grep -q "900000000001" mslite.json || { echo "::error::.ms 模型没识别出学号"; exit 1; }
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log native-core.log ci-log-native-core
      - name: C ABI headers stay pure C
        run: |
          printf '#include "engine_errors.h"\n#include "engine_ocr_capi.h"\nint main(void){return 0;}\n' > /tmp/abi_check.c
          gcc -std=c11 -Wall -Wextra -INative/capi -c /tmp/abi_check.c -o /tmp/abi_check.o

  # 模型下载 + 压缩只做一次，产物进 actions/cache，后面的 job 直接复用。
  ocr-models:
    name: Bundle OCR models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Cache bundled OCR models
        id: ocr-cache
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v3
      - name: Bundle
        if: steps.ocr-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          chmod +x ./gradlew
          bash ./gradlew --stacktrace :app:bundleOcrModels 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"

  assemble-release:
    name: Assemble release
    needs: ocr-models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v3
      - name: Check for real names
        working-directory: ${{ github.workspace }}
        env:
          REAL_NAME_HASHES: ${{ secrets.REAL_NAME_HASHES }}
        run: bash .github/scripts/check-real-names.sh
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble release
        run: |
          set -o pipefail
          # 一次 Gradle 调用出 APK + AAB；-PciSign 让 APK 用 debug key 签，能直接装
          ./gradlew --stacktrace --warning-mode=all --build-cache \
            :app:assembleRelease :app:bundleRelease -PciSign 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release AAB
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aab-release
          path: Android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint
    needs: ocr-models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint debug
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:lintDebug 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
      - name: Check lint findings
        id: lint-findings
        if: always()
        run: |
          xml=app/build/reports/lint-results-debug.xml
          if [ ! -f "$xml" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          warnings=$(grep -c 'severity="Warning"' "$xml" || true)
          errors=$(grep -c 'severity="Error"' "$xml" || true)
          if [ "$warnings" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload lint report
        if: always() && steps.lint-findings.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            Android/app/build/reports/lint-results-*.html
            Android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit tests
    needs: ocr-models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:testDebugUnitTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"

  android-test:
    name: Instrumentation APK
    needs: ocr-models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v3
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble instrumentation APK
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleDebugAndroidTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/publish-log.sh" build.log "${{ github.job }}.log" "ci-log-${{ github.job }}"
