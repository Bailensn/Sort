name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-release:
    name: Assemble release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Check for real names
        working-directory: ${{ github.workspace }}
        env:
          REAL_NAME_HASHES: ${{ secrets.REAL_NAME_HASHES }}
        run: bash .github/scripts/check-real-names.sh
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble release
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleRelease 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }
      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Lint debug
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:lintDebug 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }
      - name: Check lint findings
        id: lint-findings
        if: always()
        run: |
          xml=app/build/reports/lint-results-debug.xml
          if [ ! -f "$xml" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          warnings=$(grep -c 'severity="Warning"' "$xml" || true)
          errors=$(grep -c 'severity="Error"' "$xml" || true)
          if [ "$warnings" -gt 0 ] || [ "$errors" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload lint report
        if: always() && steps.lint-findings.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            Android/app/build/reports/lint-results-*.html
            Android/app/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 7

  unit-test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh"
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Run JVM unit tests
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:testDebugUnitTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }

  android-test:
    name: Instrumentation APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
      - name: Install SDK components
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-sdk-components.sh" ndk
      - name: Cache bundled OCR models
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: Android/app/build/generated/ocrModels
          key: ocr-models-medium-v2
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Assemble instrumentation APK
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all --build-cache :app:assembleDebugAndroidTest 2>&1 | tee build.log \
            || { bash "$GITHUB_WORKSPACE/.github/scripts/print-errors.sh" build.log; exit 1; }
