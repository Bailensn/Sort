name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  # 失败时要往提交评论里写错误摘要，所以需要写权限
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble / Test / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK components
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;30.0.16248370"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 约 31 MB，构建时由 :app:downloadOcrModels 下载；缓存后 CI 不再拉取。
      - name: Cache OCR models
        uses: actions/cache@v6
        with:
          path: app/src/main/assets/models
          key: ocr-models-ppocrv6-small-v1

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build, test and lint
        run: |
          set -o pipefail
          ./gradlew --stacktrace --warning-mode=all \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:lintDebug 2>&1 | tee build.log

      # 失败时把编译错误整理成 Job Summary + 行内注解，不用翻几万行日志。
      - name: Report build errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/report-errors.sh build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            build.log
            ci-report/errors.md
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
